<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sirus active installations</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131a;
      color: #f4f7fb;
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(42rem, calc(100% - 2rem)); padding: 2rem 0; }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.7rem, 5vw, 2.4rem); }
    .status { min-height: 1.5rem; color: #b9c3d4; }
    .status.error { color: #ff9b9b; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 1rem; margin-top: 2rem; }
    .card { border: 1px solid #303949; border-radius: .8rem; padding: 1.25rem; background: #181e29; }
    .card dt { color: #b9c3d4; font-size: .95rem; }
    .card dd { margin: .45rem 0 0; font-size: 2rem; font-variant-numeric: tabular-nums; }
    footer { margin-top: 2rem; color: #8290a6; font-size: .85rem; }
    @media (prefers-color-scheme: light) {
      :root { background: #f5f7fb; color: #172033; }
      .status, .card dt { color: #526078; }
      .card { background: #fff; border-color: #d9e0eb; }
      footer { color: #66738a; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Sirus active installations</h1>
    <p id="status" class="status" role="status" aria-live="polite">Loading statistics…</p>
    <dl class="stats" aria-label="Active installations">
      <div class="card"><dt>Last day</dt><dd id="day">—</dd></div>
      <div class="card"><dt>Last 7 days</dt><dd id="week">—</dd></div>
      <div class="card"><dt>Last 30 days</dt><dd id="month">—</dd></div>
    </dl>
    <footer>Counts are rolling estimates and may include fabricated public submissions.</footer>
  </main>
  <script>
    // Configure the page either with ?api=https://worker.example.com or by
    // defining window.SIRUS_STATS_API_URL before this script runs.
    const queryApi = new URLSearchParams(window.location.search).get('api');
    const apiBase = (queryApi || window.SIRUS_STATS_API_URL || 'https://sirus-stats.parhamsepas.workers.dev').replace(/\/$/, '');
    const status = document.getElementById('status');

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function setCount(id, value) {
      document.getElementById(id).textContent = Number(value).toLocaleString();
    }

    async function loadStats() {
      if (!apiBase) {
        setStatus('Add the Worker URL with ?api=… to load statistics.', true);
        return;
      }
      try {
        const result = await fetch(`${apiBase}/stats`, { headers: { accept: 'application/json' } });
        if (!result.ok) throw new Error('request failed');
        const stats = await result.json();
        for (const key of ['day', 'week', 'month']) {
          if (!Number.isSafeInteger(stats[key]) || stats[key] < 0) throw new Error('invalid response');
          setCount(key, stats[key]);
        }
        setStatus(`Updated ${new Date().toLocaleTimeString()}.`);
      } catch {
        setStatus('Statistics are temporarily unavailable.', true);
      }
    }

    loadStats();
  </script>
</body>
</html>
